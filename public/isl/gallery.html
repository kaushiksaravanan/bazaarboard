<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Bharat ISL Sign Gallery</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link
  href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,400;0,700;1,400;1,700&family=Plus+Jakarta+Sans:wght@400;500;700&display=swap"
  rel="stylesheet"
/>
<style>
  :root {
    --canvas: #F5EFE3;
    --tangerine: #F26B1F;
    --tangerine-soft: #F26B1F22;
    --ink: #1F1409;
    --ink-soft: #1F14099A;
    --card: #FFFDF6;
    --border: #1F140922;
    --ok: #2E7D32;
    --miss: #C62828;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: var(--canvas); color: var(--ink); }
  body { font-family: "Plus Jakarta Sans", system-ui, sans-serif; min-height: 100vh; }

  header {
    padding: 48px 32px 24px;
    max-width: 1400px;
    margin: 0 auto;
  }
  h1 {
    font-family: "Fraunces", serif;
    font-style: italic;
    font-weight: 700;
    font-size: clamp(2rem, 4.5vw, 3.4rem);
    margin: 0 0 8px 0;
    color: var(--ink);
    letter-spacing: -0.02em;
  }
  h1 .accent { color: var(--tangerine); }
  .subtitle {
    font-size: 1rem;
    color: var(--ink-soft);
    margin: 0 0 32px 0;
    font-weight: 500;
  }

  .controls {
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
    align-items: center;
    margin-bottom: 8px;
  }
  .search {
    flex: 1 1 260px;
    min-width: 220px;
    max-width: 420px;
    padding: 12px 16px;
    font-family: inherit;
    font-size: 1rem;
    border: 1.5px solid var(--border);
    border-radius: 999px;
    background: var(--card);
    color: var(--ink);
    outline: none;
    transition: border-color 120ms;
  }
  .search:focus { border-color: var(--tangerine); }
  .btn {
    padding: 12px 20px;
    border: 1.5px solid var(--tangerine);
    background: var(--tangerine);
    color: white;
    font-family: inherit;
    font-weight: 700;
    font-size: 0.95rem;
    border-radius: 999px;
    cursor: pointer;
    transition: transform 120ms, background 120ms;
  }
  .btn:hover { transform: translateY(-1px); background: #d95a12; }
  .btn.ghost {
    background: transparent;
    color: var(--tangerine);
  }
  .btn.ghost:hover { background: var(--tangerine-soft); }

  .count {
    color: var(--ink-soft);
    font-size: 0.9rem;
    font-weight: 500;
    margin-left: auto;
  }

  main {
    padding: 24px 32px 48px;
    max-width: 1400px;
    margin: 0 auto;
  }

  .grid {
    display: grid;
    gap: 20px;
    grid-template-columns: repeat(3, 1fr);
  }
  @media (max-width: 1000px) { .grid { grid-template-columns: repeat(2, 1fr); } }
  @media (max-width: 640px)  { .grid { grid-template-columns: 1fr; } }

  .card {
    background: var(--card);
    border: 1.5px solid var(--border);
    border-radius: 20px;
    padding: 16px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
    transition: transform 160ms, box-shadow 160ms, border-color 160ms;
  }
  .card:hover {
    transform: translateY(-2px);
    border-color: var(--tangerine);
    box-shadow: 0 8px 24px #1F14091A;
  }
  .card.hidden { display: none; }

  .frame-wrap {
    width: 240px;
    height: 240px;
    border-radius: 14px;
    overflow: hidden;
    background: var(--canvas);
    border: 1px solid var(--border);
    position: relative;
  }
  .frame-wrap iframe {
    width: 100%;
    height: 100%;
    border: 0;
    display: block;
  }

  .word {
    font-family: "Plus Jakarta Sans", sans-serif;
    font-weight: 700;
    color: var(--tangerine);
    font-size: 1.35rem;
    letter-spacing: 0.02em;
    text-align: center;
    line-height: 1.1;
  }
  .meta {
    font-size: 0.8rem;
    color: var(--ink-soft);
    text-align: center;
    line-height: 1.4;
    font-weight: 500;
  }
  .meta .hindi {
    font-family: "Fraunces", serif;
    font-style: italic;
    color: var(--ink);
  }
  .status {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    font-size: 0.72rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    padding: 3px 10px;
    border-radius: 999px;
    background: var(--canvas);
  }
  .status .dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    display: inline-block;
  }
  .status.ok { color: var(--ok); }
  .status.ok .dot { background: var(--ok); }
  .status.miss { color: var(--miss); }
  .status.miss .dot { background: transparent; border: 1.5px solid var(--miss); }

  .empty {
    text-align: center;
    padding: 80px 20px;
    color: var(--ink-soft);
    font-style: italic;
  }
  .empty .fr { font-family: "Fraunces", serif; font-size: 1.2rem; }

  footer {
    max-width: 1400px;
    margin: 0 auto;
    padding: 32px;
    border-top: 1px solid var(--border);
    font-size: 0.85rem;
    color: var(--ink-soft);
    display: flex;
    flex-wrap: wrap;
    gap: 20px;
    justify-content: space-between;
    align-items: center;
  }
  footer a { color: var(--tangerine); text-decoration: none; font-weight: 600; }
  footer a:hover { text-decoration: underline; }
  .cc { font-size: 0.75rem; opacity: 0.7; }
</style>
</head>
<body>

<header>
  <h1>Bharat <span class="accent">ISL</span> Sign Gallery</h1>
  <p class="subtitle">30 signs. Rendered live from MediaPipe pose data. Deaf-first.</p>
  <div class="controls">
    <input class="search" id="search" type="search" placeholder="Search word (e.g. mango, बेचना, sell)…" autocomplete="off" />
    <button class="btn" id="regen">Regenerate all</button>
    <span class="count" id="count"></span>
  </div>
</header>

<main>
  <div class="grid" id="grid"></div>
  <div class="empty" id="empty" style="display:none;">
    <div class="fr">No signs match.</div>
    <div>Try a different word.</div>
  </div>
</main>

<footer>
  <div>
    <a href="/api/lexicon">Raw lexicon JSON</a>
    &nbsp;·&nbsp;
    <a href="https://github.com/kaushiksaravanan/bazaarboard" target="_blank" rel="noopener">bazaarboard on GitHub</a>
  </div>
  <div class="cc">Sign choreographies licensed CC-BY-4.0. Attribute BazaarBoard + source (ISLRTC / indiansignlanguage.org).</div>
</footer>

<script>
(async () => {
  const grid = document.getElementById('grid');
  const empty = document.getElementById('empty');
  const search = document.getElementById('search');
  const regen = document.getElementById('regen');
  const count = document.getElementById('count');

  let entries = [];

  try {
    const res = await fetch('/isl/lexicon.json', { cache: 'no-store' });
    const data = await res.json();
    entries = Object.entries(data.signs || {}).map(([key, sign]) => ({
      key,
      gloss: sign.gloss || key,
      english: sign.english || '',
      hindi: sign.hindi || '',
      source: sign.source || 'unknown',
      hasPose: !!sign.posesUrl
    }));
  } catch (e) {
    grid.innerHTML = '<div class="empty"><div class="fr">Failed to load /isl/lexicon.json</div><div>' + (e.message || e) + '</div></div>';
    return;
  }

  // Render cards
  const cards = entries.map(sign => {
    const card = document.createElement('div');
    card.className = 'card';
    card.dataset.search = [sign.gloss, sign.english, sign.hindi, sign.source].join(' ').toLowerCase();

    const wrap = document.createElement('div');
    wrap.className = 'frame-wrap';
    const iframe = document.createElement('iframe');
    iframe.loading = 'lazy';
    iframe.setAttribute('title', sign.gloss + ' sign');
    iframe.dataset.src = `/isl/signer.html?word=${encodeURIComponent(sign.gloss)}&loop=1`;
    wrap.appendChild(iframe);

    const word = document.createElement('div');
    word.className = 'word';
    word.textContent = sign.gloss;

    const meta = document.createElement('div');
    meta.className = 'meta';
    const srcShort = sign.source.includes('islrtc') ? 'islrtc-youtube-mediapipe'
                  : sign.source.includes('mock') ? 'mock-choreography'
                  : sign.source;
    const statusClass = sign.hasPose ? 'ok' : 'miss';
    const statusLabel = sign.hasPose ? 'pose' : 'missing';
    meta.innerHTML =
      `${sign.english} · <span class="hindi">${sign.hindi}</span><br>` +
      `<span class="status ${statusClass}"><span class="dot"></span>${statusLabel}</span> ` +
      `<span style="opacity:0.75;">${srcShort}</span>`;

    card.appendChild(wrap);
    card.appendChild(word);
    card.appendChild(meta);
    grid.appendChild(card);
    return { card, iframe, sign };
  });

  // Lazy-load iframes on intersection (avoid 30 concurrent Three.js contexts on mobile)
  const io = new IntersectionObserver((observed) => {
    for (const entry of observed) {
      const el = entry.target;
      const iframe = el.querySelector('iframe');
      if (!iframe) continue;
      if (entry.isIntersecting) {
        if (!iframe.src && iframe.dataset.src) iframe.src = iframe.dataset.src;
      }
    }
  }, { rootMargin: '200px' });
  cards.forEach(c => io.observe(c.card));

  // Search filter
  const applyFilter = () => {
    const q = search.value.trim().toLowerCase();
    let visible = 0;
    cards.forEach(({ card }) => {
      const match = !q || card.dataset.search.includes(q);
      card.classList.toggle('hidden', !match);
      if (match) visible++;
    });
    empty.style.display = visible === 0 ? 'block' : 'none';
    count.textContent = `${visible} of ${cards.length} signs`;
  };
  search.addEventListener('input', applyFilter);
  applyFilter();

  // Regenerate: reload every iframe
  regen.addEventListener('click', () => {
    cards.forEach(({ iframe }) => {
      const src = iframe.dataset.src;
      iframe.src = 'about:blank';
      // small delay then reassign
      requestAnimationFrame(() => { iframe.src = src; });
    });
  });
})();
</script>
</body>
</html>
